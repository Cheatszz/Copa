async function loadData(){const pub=async()=>{const r=await fetch('data.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.json()};

async function saveGH(){if(!owner){msg='Conecte ao GitHub primeiro (⚙️).';return render()}

const by=new TextEncoder().encode(JSON.stringify(S));let bin='';for(let i=0;i<by.length;i+=8192)bin+=String.fromCharCode(...by.subarray(i,i+8192));
